<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="NEBULA AR — a receivables operating system for MSTC e-auction settlements.">
<title>NEBULA AR · Receivables Operating System</title>
<style>
/* ============================================================================
 * NEBULA AR — theme.css
 * Design tokens, base layer, and the futuristic surface language.
 * ==========================================================================*/

@layer reset, tokens, base, shell, components, charts, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  table { border-collapse: collapse; }
  a { color: inherit; text-decoration: none; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  h1, h2, h3, h4, p { margin: 0; }
  svg { display: block; }
}

@layer tokens {
  :root {
    /* surfaces */
    --bg-0: #04060f;
    --bg-1: #070b1a;
    --bg-2: #0b1124;
    --panel: rgba(17, 24, 48, 0.62);
    --panel-solid: #101832;
    --panel-hover: rgba(30, 42, 82, 0.78);
    --border: rgba(126, 154, 255, 0.16);
    --border-strong: rgba(126, 154, 255, 0.34);
    --grid: rgba(126, 154, 255, 0.10);

    /* type */
    --text: #e8ecff;
    --text-dim: #97a3cc;
    --text-faint: #63709a;

    /* accents */
    --accent: #4f7cff;
    --accent-2: #22d3ee;
    --accent-3: #a855f7;
    --good: #2ee6a8;
    --warn: #ffb547;
    --bad: #ff5d7e;
    --info: #60a5fa;

    --grad-accent: linear-gradient(135deg, #4f7cff 0%, #22d3ee 100%);
    --grad-violet: linear-gradient(135deg, #a855f7 0%, #4f7cff 100%);
    --grad-aurora: linear-gradient(120deg, #4f7cff, #22d3ee, #a855f7, #4f7cff);

    /* metrics */
    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-xl: 28px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

    --shadow-1: 0 2px 8px rgba(2, 6, 23, 0.5);
    --shadow-2: 0 12px 40px rgba(2, 6, 23, 0.6);
    --glow-accent: 0 0 24px rgba(79, 124, 255, 0.35);
    --glow-soft: 0 0 60px rgba(34, 211, 238, 0.16);

    --sidebar-w: 248px;
    --topbar-h: 62px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  [data-theme="light"] {
    --bg-0: #eef1fb;
    --bg-1: #f6f8ff;
    --bg-2: #ffffff;
    --panel: rgba(255, 255, 255, 0.82);
    --panel-solid: #ffffff;
    --panel-hover: rgba(232, 238, 255, 0.95);
    --border: rgba(40, 60, 130, 0.14);
    --border-strong: rgba(40, 60, 130, 0.28);
    --grid: rgba(40, 60, 130, 0.10);
    --text: #101736;
    --text-dim: #4b5680;
    --text-faint: #7b86ad;
    --shadow-2: 0 12px 34px rgba(24, 39, 92, 0.14);
  }

  [data-density="compact"] { --sp-4: 10px; --sp-5: 16px; --sp-6: 22px; }
}

@layer base {
  body {
    font-family: var(--font);
    background: var(--bg-0);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Ambient aurora background */
  .bg-field {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(79, 124, 255, 0.24), transparent 62%),
      radial-gradient(900px 560px at 92% 4%, rgba(168, 85, 247, 0.20), transparent 60%),
      radial-gradient(1000px 700px at 60% 108%, rgba(34, 211, 238, 0.16), transparent 62%),
      var(--bg-0);
  }
  .bg-field::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
    opacity: .55;
  }
  .bg-orb {
    position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5;
    z-index: 0; pointer-events: none; animation: drift 26s var(--ease) infinite alternate;
  }
  .bg-orb.o1 { width: 460px; height: 460px; left: -120px; top: 12%; background: #2b46c9; }
  .bg-orb.o2 { width: 380px; height: 380px; right: -90px; top: 44%; background: #7b2ff7; animation-duration: 34s; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(60px, -46px, 0) scale(1.14); }
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: content-box; }

  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
}

@layer shell {
  .app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }
  .app[data-rail="true"] { grid-template-columns: 68px 1fr; }

  /* ---------- sidebar ---------- */
  .sidebar {
    display: flex; flex-direction: column; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-3);
    border-right: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(10, 15, 34, 0.72), rgba(6, 9, 22, 0.5));
    backdrop-filter: blur(18px);
    overflow: hidden auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    background: var(--grad-accent); box-shadow: var(--glow-accent); flex: none;
  }
  .brand-mark svg { width: 20px; height: 20px; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .brand-name { font-weight: 700; letter-spacing: .3px; font-size: 15px; }
  .brand-sub { font-size: 10.5px; color: var(--text-faint); letter-spacing: 1.4px; text-transform: uppercase; }
  [data-rail="true"] .brand-text, [data-rail="true"] .nav-label,
  [data-rail="true"] .nav-group-title, [data-rail="true"] .tenant-name,
  [data-rail="true"] .nav-badge { display: none; }
  [data-rail="true"] .nav-item { justify-content: center; padding: 10px 0; }

  .tenant {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--r-md);
    background: var(--panel);
  }
  .tenant-avatar {
    width: 28px; height: 28px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: var(--grad-violet); font-size: 12px; font-weight: 700;
  }
  .tenant-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tenant-plan { font-size: 10px; color: var(--accent-2); letter-spacing: 1px; text-transform: uppercase; }

  .nav-group-title {
    font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--text-faint); padding: 12px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 11px; border-radius: var(--r-sm);
    color: var(--text-dim); font-size: 13.5px; position: relative;
    transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
  }
  .nav-item svg { width: 17px; height: 17px; flex: none; }
  .nav-item:hover { background: var(--panel-hover); color: var(--text); transform: translateX(2px); }
  .nav-item[aria-current="page"] {
    background: linear-gradient(90deg, rgba(79, 124, 255, 0.22), rgba(79, 124, 255, 0.04));
    color: #fff;
  }
  .nav-item[aria-current="page"]::before {
    content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--accent-2);
    box-shadow: 0 0 12px var(--accent-2);
  }
  .nav-badge {
    margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 1px 7px;
    border-radius: 99px; background: rgba(255, 93, 126, 0.18); color: var(--bad);
  }

  /* ---------- topbar ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: var(--topbar-h); flex: none; display: flex; align-items: center; gap: var(--sp-3);
    padding: 0 var(--sp-5); border-bottom: 1px solid var(--border);
    background: rgba(7, 11, 26, 0.55); backdrop-filter: blur(18px);
  }
  .crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); min-width: 0; }
  .crumbs strong { color: var(--text); font-weight: 600; }
  .crumbs span { color: var(--text-faint); }

  .searchbox {
    display: flex; align-items: center; gap: 8px; flex: 1; max-width: 460px;
    padding: 7px 12px; border-radius: 99px; border: 1px solid var(--border);
    background: var(--panel); transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .searchbox:focus-within { border-color: var(--accent); box-shadow: var(--glow-accent); }
  .searchbox input { flex: 1; background: none; border: 0; outline: none; font-size: 13px; min-width: 0; }
  .searchbox svg { width: 15px; height: 15px; color: var(--text-faint); flex: none; }
  .kbd {
    font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--border); color: var(--text-faint); background: rgba(255,255,255,.03);
  }

  .topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    color: var(--text-dim); border: 1px solid transparent; position: relative;
    transition: all .18s var(--ease);
  }
  .icon-btn:hover { background: var(--panel-hover); color: var(--text); border-color: var(--border); }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn .dot {
    position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--bad); box-shadow: 0 0 8px var(--bad);
  }

  .viewport { flex: 1; overflow: hidden auto; padding: var(--sp-5) var(--sp-6) var(--sp-7); scroll-behavior: smooth; }
  .page { animation: pageIn .38s var(--ease) both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .page-head { display: flex; align-items: flex-end; gap: var(--sp-4); margin-bottom: var(--sp-5); flex-wrap: wrap; }
  .page-title { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
  .page-sub { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
  .page-head .spacer { flex: 1; }
}

@layer components {
  /* ---------- panels ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: var(--sp-4); backdrop-filter: blur(16px); box-shadow: var(--shadow-1);
    position: relative; overflow: hidden;
  }
  .panel::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
  }
  .panel-title { font-size: 13px; font-weight: 650; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .panel-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
  .panel-head { display: flex; align-items: flex-start; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  .panel-head .spacer { flex: 1; }

  .grid { display: grid; gap: var(--sp-4); }
  .g-kpi { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .g-2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
  .g-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .g-side { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
  @media (max-width: 1180px) { .g-side { grid-template-columns: 1fr; } }
  .stack { display: flex; flex-direction: column; gap: var(--sp-4); }
  .row { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }

  /* ---------- KPI ---------- */
  .kpi { padding: var(--sp-4); cursor: default; transition: transform .22s var(--ease), border-color .22s var(--ease); }
  .kpi:hover { transform: translateY(-3px); border-color: var(--border-strong); }
  .kpi-label { font-size: 11.5px; color: var(--text-dim); letter-spacing: .5px; text-transform: uppercase; }
  .kpi-value { font-size: 27px; font-weight: 700; letter-spacing: -.6px; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .kpi-foot { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-faint); }
  .kpi-spark { margin-top: 8px; height: 40px; }
  .kpi-spark svg { width: 100%; height: 100%; }
  .delta { font-weight: 700; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .kpi-bar { height: 4px; border-radius: 99px; background: var(--grid); margin-top: 10px; overflow: hidden; }
  .kpi-bar i { display: block; height: 100%; border-radius: 99px; background: var(--grad-accent); animation: grow .9s var(--ease) both; }
  @keyframes grow { from { transform: scaleX(0); transform-origin: left; } }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px;
    border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--panel);
    font-size: 13px; font-weight: 550; color: var(--text);
    transition: all .18s var(--ease); white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { background: var(--panel-hover); border-color: var(--border-strong); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.primary {
    background: var(--grad-accent); border-color: transparent; color: #fff;
    box-shadow: var(--glow-accent);
  }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--bad); border-color: rgba(255, 93, 126, .35); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 99px; border: 1px solid var(--border); background: var(--panel); }
  .seg button {
    padding: 5px 13px; border-radius: 99px; font-size: 12px; color: var(--text-dim);
    transition: all .18s var(--ease);
  }
  .seg button[aria-pressed="true"] { background: var(--grad-accent); color: #fff; box-shadow: var(--glow-accent); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
    font-size: 11.5px; border: 1px solid var(--border); background: rgba(255,255,255,.03); color: var(--text-dim);
  }
  .chip.good { color: var(--good); border-color: rgba(46, 230, 168, .32); background: rgba(46, 230, 168, .10); }
  .chip.bad { color: var(--bad); border-color: rgba(255, 93, 126, .32); background: rgba(255, 93, 126, .10); }
  .chip.warn { color: var(--warn); border-color: rgba(255, 181, 71, .32); background: rgba(255, 181, 71, .10); }
  .chip.info { color: var(--info); border-color: rgba(96, 165, 250, .32); background: rgba(96, 165, 250, .10); }
  .chip.violet { color: #c9a6ff; border-color: rgba(168, 85, 247, .32); background: rgba(168, 85, 247, .12); }

  /* ---------- inputs ---------- */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11.5px; color: var(--text-dim); letter-spacing: .3px; }
  .input, select.input, textarea.input {
    padding: 8px 12px; border-radius: var(--r-sm); border: 1px solid var(--border);
    background: rgba(4, 7, 18, .55); outline: none; font-size: 13px; width: 100%;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  [data-theme="light"] .input { background: rgba(255,255,255,.9); }
  .input:focus { border-color: var(--accent); box-shadow: var(--glow-accent); }
  .input::placeholder { color: var(--text-faint); }
  select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; }
  .switch input { display: none; }
  .switch i {
    width: 38px; height: 21px; border-radius: 99px; background: var(--grid);
    position: relative; transition: background .2s var(--ease); flex: none;
  }
  .switch i::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px;
    border-radius: 50%; background: var(--text-dim); transition: all .22s var(--ease);
  }
  .switch input:checked + i { background: var(--grad-accent); }
  .switch input:checked + i::after { transform: translateX(17px); background: #fff; }

  /* ---------- tables ---------- */
  .table-wrap { overflow: auto; border-radius: var(--r-md); border: 1px solid var(--border); max-height: 62vh; }
  table.data { width: 100%; font-size: 12.8px; font-variant-numeric: tabular-nums; }
  table.data thead th {
    position: sticky; top: 0; z-index: 2; text-align: left; white-space: nowrap;
    padding: 10px 12px; background: var(--panel-solid); color: var(--text-dim);
    font-weight: 600; font-size: 11.5px; letter-spacing: .4px; text-transform: uppercase;
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
  }
  table.data thead th:hover { color: var(--text); }
  table.data thead th[aria-sort] { color: var(--accent-2); }
  table.data tbody td { padding: 9px 12px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  table.data tbody tr { transition: background .14s var(--ease); }
  table.data tbody tr:hover { background: var(--panel-hover); }
  table.data tbody tr[tabindex] { cursor: pointer; }
  table.data td.num { text-align: right; }
  table.data tfoot td {
    position: sticky; bottom: 0; padding: 10px 12px; font-weight: 700;
    background: var(--panel-solid); border-top: 1px solid var(--border-strong);
  }
  .cell-buyer { display: flex; align-items: center; gap: 8px; }
  .cell-buyer i {
    width: 22px; height: 22px; border-radius: 7px; flex: none; display: grid; place-items: center;
    font-size: 10px; font-style: normal; font-weight: 700; color: #fff;
  }
  .mono { font-family: var(--mono); font-size: 12px; }
  .empty { padding: var(--sp-7); text-align: center; color: var(--text-faint); }

  /* ---------- drawer / modal ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 60; background: rgba(2, 4, 14, .68);
    backdrop-filter: blur(4px); animation: fade .2s var(--ease) both;
  }
  @keyframes fade { from { opacity: 0; } }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 94vw); z-index: 61;
    background: var(--panel-solid); border-left: 1px solid var(--border-strong);
    box-shadow: var(--shadow-2); display: flex; flex-direction: column;
    animation: slideIn .3s var(--ease) both;
  }
  @keyframes slideIn { from { transform: translateX(28px); opacity: 0; } }
  .drawer-head { padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--sp-3); }
  .drawer-body { flex: 1; overflow: auto; padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-4); }
  .drawer-foot { padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--border); display: flex; gap: var(--sp-2); justify-content: flex-end; }

  .modal {
    position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(640px, 94vw); max-height: 86vh; overflow: auto;
    background: var(--panel-solid); border: 1px solid var(--border-strong);
    border-radius: var(--r-lg); box-shadow: var(--shadow-2);
    animation: pop .22s var(--ease) both;
  }
  @keyframes pop { from { transform: translate(-50%, -46%) scale(.97); opacity: 0; } }

  /* ---------- command palette ---------- */
  .palette {
    position: fixed; z-index: 70; left: 50%; top: 12vh; transform: translateX(-50%);
    width: min(620px, 94vw); background: var(--panel-solid);
    border: 1px solid var(--border-strong); border-radius: var(--r-lg);
    box-shadow: var(--shadow-2), var(--glow-soft); overflow: hidden;
    animation: pop2 .2s var(--ease) both;
  }
  @keyframes pop2 { from { transform: translate(-50%, -8px); opacity: 0; } }
  .palette-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .palette-input input { flex: 1; background: none; border: 0; outline: none; font-size: 15px; }
  .palette-list { max-height: 52vh; overflow: auto; padding: 6px; }
  .palette-item {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    padding: 9px 12px; border-radius: var(--r-sm); font-size: 13.5px; color: var(--text-dim);
  }
  .palette-item svg { width: 16px; height: 16px; flex: none; }
  .palette-item .hint { margin-left: auto; font-size: 11px; color: var(--text-faint); }
  .palette-item[data-active="true"] { background: var(--panel-hover); color: var(--text); }
  .palette-group { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-faint); padding: 10px 12px 4px; }

  /* ---------- toasts ---------- */
  .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 9px; }
  .toast {
    display: flex; align-items: center; gap: 10px; padding: 11px 15px; min-width: 250px;
    border-radius: var(--r-md); background: var(--panel-solid); border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-2); font-size: 13px; animation: toastIn .28s var(--ease) both;
  }
  .toast.out { animation: toastOut .22s var(--ease) both; }
  .toast svg { width: 16px; height: 16px; flex: none; }
  .toast.good svg { color: var(--good); } .toast.bad svg { color: var(--bad); }
  .toast.warn svg { color: var(--warn); } .toast.info svg { color: var(--info); }
  @keyframes toastIn { from { transform: translateX(24px); opacity: 0; } }
  @keyframes toastOut { to { transform: translateX(24px); opacity: 0; } }

  /* ---------- timeline ---------- */
  .timeline { position: relative; padding-left: 22px; display: flex; flex-direction: column; gap: var(--sp-4); }
  .timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(180deg, var(--accent), var(--accent-3)); border-radius: 2px; }
  .tl-item { position: relative; }
  .tl-item::before {
    content: ""; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2);
  }
  .tl-item.pending::before { background: var(--text-faint); box-shadow: none; }
  .tl-title { font-size: 13px; font-weight: 600; }
  .tl-meta { font-size: 11.5px; color: var(--text-faint); }

  /* ---------- misc ---------- */
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 12.8px; }
  .kv dt { color: var(--text-dim); }
  .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .progress { height: 7px; border-radius: 99px; background: var(--grid); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--grad-accent); border-radius: 99px; transition: width .6s var(--ease); }
  .progress.good i { background: linear-gradient(90deg, var(--good), #7dfbd0); }
  .progress.bad i { background: linear-gradient(90deg, var(--bad), #ff9bb1); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; }
  .divider { height: 1px; background: var(--border); margin: var(--sp-2) 0; }
  .muted { color: var(--text-faint); }
  .small { font-size: 11.5px; }
  .tabular { font-variant-numeric: tabular-nums; }
  .nowrap { white-space: nowrap; }
}

@layer charts {
  .chart { width: 100%; height: auto; }
  .chart.donut, .chart.heat { width: auto; margin: 0 auto; }
  .c-tick { fill: var(--text-faint); font-size: 10.5px; font-family: var(--font); }
  .c-label { fill: var(--text-dim); font-size: 11.5px; font-family: var(--font); }
  .c-value { fill: var(--text); font-size: 11.5px; font-family: var(--font); font-variant-numeric: tabular-nums; }
  .c-centre { fill: var(--text); font-size: 26px; font-weight: 700; font-family: var(--font); }
  .c-sublabel { fill: var(--text-faint); font-size: 11px; letter-spacing: .8px; text-transform: uppercase; font-family: var(--font); }

  .c-bar, .c-hbar, .c-cell { animation: rise .55s var(--ease) both; animation-delay: var(--d, 0ms); transform-box: fill-box; transform-origin: bottom; }
  .c-hbar { transform-origin: left; }
  @keyframes rise { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
  .c-arc { animation: arcIn .7s var(--ease) both; animation-delay: var(--d, 0ms); }
  @keyframes arcIn { from { opacity: 0; stroke-dasharray: 0 9999; } }
  .c-line { stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: draw 1.1s var(--ease) forwards; animation-delay: var(--d, 0ms); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .c-area { opacity: 0; animation: fadeIn .8s var(--ease) forwards; animation-delay: var(--d, 0ms); }
  @keyframes fadeIn { to { opacity: 1; } }

  .spark { width: 100%; height: 100%; }
}

@layer utilities {
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .center { display: grid; place-items: center; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
  .grow { flex: 1; }
  .mt-0 { margin-top: 0; } .mt-2 { margin-top: var(--sp-2); } .mt-4 { margin-top: var(--sp-4); }
  .mb-2 { margin-bottom: var(--sp-2); } .mb-4 { margin-bottom: var(--sp-4); }
  .hide-sm { display: initial; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .viewport { padding: var(--sp-4); }
    .hide-sm { display: none; }
  }

  @media print {
    .sidebar, .topbar, .toasts, .drawer, .scrim, .palette, .bg-field, .bg-orb { display: none !important; }
    .app { display: block; height: auto; }
    body { overflow: visible; background: #fff; color: #000; }
    .panel { break-inside: avoid; box-shadow: none; border-color: #ccc; background: #fff; }
    .viewport { overflow: visible; padding: 0; }
  }
}

/* ---------- login ---------- */
.login {
  position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: var(--sp-5);
}
.login-card {
  width: min(420px, 100%); padding: var(--sp-6);
  background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--r-xl);
  backdrop-filter: blur(22px); box-shadow: var(--shadow-2), var(--glow-soft);
  animation: pop3 .5s var(--ease) both;
}
@keyframes pop3 { from { transform: translateY(16px) scale(.98); opacity: 0; } }
.login-logo { display: grid; place-items: center; margin-bottom: var(--sp-4); }
.login-logo .brand-mark { width: 54px; height: 54px; border-radius: 17px; }
.login-logo .brand-mark svg { width: 30px; height: 30px; }
.login h1 { text-align: center; font-size: 21px; letter-spacing: -.3px; }
.login .tagline {
  text-align: center; font-size: 12.5px; color: var(--text-dim); margin: 6px 0 var(--sp-5);
}
.role-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: var(--sp-4); }
.role-picker button {
  padding: 10px 6px; border-radius: var(--r-md); border: 1px solid var(--border);
  background: rgba(255,255,255,.02); font-size: 12px; color: var(--text-dim);
  transition: all .18s var(--ease);
}
.role-picker button[aria-pressed="true"] {
  border-color: var(--accent); color: var(--text); background: rgba(79, 124, 255, .14);
  box-shadow: var(--glow-accent);
}
.login-foot { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: var(--sp-4); }
.aurora-text {
  background: var(--grad-aurora); background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: aurora 9s linear infinite;
}
@keyframes aurora { to { background-position: 300% 0; } }

\n  const scrim = document.createElement('div');\n  scrim.className = 'scrim';\n  scrim.onclick = closeOverlays;\n  const modal = document.createElement('div');\n  modal.className = 'modal';\n  modal.setAttribute('role', 'dialog');\n  modal.innerHTML = html;\n  document.body.append(scrim, modal);\n  store.ui.modal = { scrim, modal };\n  modal.querySelectorAll('[data-close]').forEach((b) => (b.onclick = closeOverlays));\n  onMount?.(modal);\n  modal.querySelector('[data-autofocus]')?.focus();\n}\n\nexport function closeOverlays() {\n  document.querySelectorAll('.scrim, .drawer, .modal').forEach((n) => n.remove());\n  store.ui.drawer = null;\n  store.ui.modal = null;\n}\n\n/* -------------------------------------------------------------------------- */\n/* lot detail drawer                                                           */\n/* -------------------------------------------------------------------------- */\n\nexport function showLot(lot) {\n  const r = derived().records.find((x) => x.lot === Number(lot));\n  if (!r) return;\n  const score = riskScore(r, asOf());\n  const band = riskBand(score);\n  const issues = derived().issues.filter((i) => i.lot === r.lot);\n  const pct = r.receivable ? r.totalReceived / r.receivable : 0;\n\n  const events = [\n    r.invoiceDate && { date: r.invoiceDate, title: 'Invoice raised', meta: `${r.invoiceNo || 'no invoice number'} · SAP ${r.sapDocument || '—'}` },\n    r.sdDate && { date: r.sdDate, title: 'Security deposit received', meta: `₹${fmt0(r.sdReceived)} (25% of material value)` },\n    r.fpDate && { date: r.fpDate, title: 'Final payment received', meta: `₹${fmt0(r.fpReceived)}` },\n    r.lppDate && { date: r.lppDate, title: 'Late payment penalty settled', meta: `₹${fmt0(r.lppReceived)}` },\n    !r.fpDate && { date: null, title: 'Final payment outstanding', meta: `₹${fmt0(Math.max(0, r.outstanding))} still due`, pending: true },\n  ].filter(Boolean).sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);\n\n  openDrawer(`\n    <div class=\"drawer-head\">\n      <div class=\"grow\">\n        <div class=\"row\" style=\"gap:8px\">\n          <h2 style=\"font-size:19px\">Lot ${r.lot}</h2>\n          <span class=\"chip ${r.status === 'SETTLED' ? 'good' : 'bad'}\">${r.status}</span>\n          <span class=\"chip ${band.id === 'critical' || band.id === 'high' ? 'bad' : band.id === 'medium' ? 'warn' : 'good'}\">Risk ${score} · ${band.label}</span>\n        </div>\n        <div class=\"panel-sub\">${r.buyer}</div>\n      </div>\n      <button class=\"icon-btn\" data-close aria-label=\"Close\">${ICON.close}</button>\n    </div>\n    <div class=\"drawer-body\">\n      <div class=\"panel\">\n        <div class=\"between mb-2\">\n          <div><div class=\"panel-sub\">Collected</div><div style=\"font-size:22px;font-weight:700\">₹${fmt0(r.totalReceived)}</div></div>\n          <div style=\"text-align:right\"><div class=\"panel-sub\">Outstanding</div><div style=\"font-size:22px;font-weight:700;color:${r.outstanding > 0 ? 'var(--bad)' : 'var(--good)'}\">₹${fmt0(r.outstanding)}</div></div>\n        </div>\n        <div class=\"progress ${pct >= 0.999 ? 'good' : ''}\"><i style=\"width:${Math.min(100, pct * 100).toFixed(1)}%\"></i></div>\n        <div class=\"small muted mt-2\">${fmtPct(pct, 2)} of ₹${fmt0(r.receivable)} receivable</div>\n      </div>\n\n      <div class=\"panel\">\n        <div class=\"panel-title mb-2\">Commercial build-up</div>\n        <dl class=\"kv\">\n          <dt>Material value</dt><dd>₹${fmt0(r.materialValue)}</dd>\n          <dt>Service charge to MSTC</dt><dd>₹${fmt0(r.serviceCharge)}</dd>\n          <dt>GST TDS</dt><dd>₹${fmt0(r.gstTds)}</dd>\n          <dt>Total receivables in cash</dt><dd><strong>₹${fmt0(r.receivable)}</strong></dd>\n          <dt>Security deposit</dt><dd>₹${fmt0(r.sdReceived)} <span class=\"muted\">/ exp ₹${fmt0(Math.round(r.materialValue * 0.25))}</span></dd>\n          <dt>Final payment</dt><dd>₹${fmt0(r.fpReceived)} <span class=\"muted\">/ exp ₹${fmt0(Math.round(r.materialValue * 0.9265 - r.gstTds))}</span></dd>\n          <dt>LPP</dt><dd>₹${fmt0(r.lppReceived)} <span class=\"muted\">/ exp ₹${fmt0(r.lppExpected)}</span></dd>\n        </dl>\n      </div>\n\n      <div class=\"panel\">\n        <div class=\"panel-title mb-2\">Document trail</div>\n        <dl class=\"kv\">\n          <dt>Invoice no.</dt><dd>${r.invoiceNo ? `<span class=\"mono\">${r.invoiceNo}</span>` : '<span class=\"chip warn\">missing</span>'}</dd>\n          <dt>SAP document</dt><dd>${r.sapDocument ? `<span class=\"mono\">${r.sapDocument}</span>` : '<span class=\"chip warn\">missing</span>'}</dd>\n          <dt>Document date</dt><dd>${r.invoiceDate ? fmtDate(r.invoiceDate) : '<span class=\"chip warn\">missing</span>'}</dd>\n        </dl>\n      </div>\n\n      <div class=\"panel\">\n        <div class=\"panel-title mb-4\">Timeline</div>\n        <div class=\"timeline\">\n          ${events.map((e) => `<div class=\"tl-item ${e.pending ? 'pending' : ''}\">\n            <div class=\"tl-title\">${e.title}</div>\n            <div class=\"tl-meta\">${e.date ? fmtDate(e.date) : 'pending'} · ${e.meta}</div>\n          </div>`).join('')}\n        </div>\n      </div>\n\n      ${issues.length ? `<div class=\"panel\">\n        <div class=\"panel-title mb-2\">${ICON.alert} Exceptions (${issues.length})</div>\n        <ul class=\"stack\" style=\"gap:6px\">\n          ${issues.map((i) => `<li class=\"small\"><span class=\"chip ${i.severity === 'high' ? 'bad' : i.severity === 'medium' ? 'warn' : 'info'}\">${i.code}</span> ${i.message}</li>`).join('')}\n        </ul>\n      </div>` : ''}\n    </div>\n    <div class=\"drawer-foot\">\n      <button class=\"btn ghost\" data-close>Close</button>\n      <button class=\"btn primary\" data-pay=\"${r.lot}\">${ICON.bolt} Record payment</button>\n    </div>\n  `, (drawer) => {\n    drawer.querySelector('[data-pay]')?.addEventListener('click', () => {\n      closeOverlays();\n      promptPayment(r.lot);\n    });\n  });\n}\n\nexport function promptPayment(lot) {\n  const r = derived().records.find((x) => x.lot === Number(lot));\n  if (!r) return;\n  openModal(`\n    <div class=\"drawer-head\">\n      <div class=\"grow\"><h2 style=\"font-size:17px\">Record receipt · Lot ${r.lot}</h2>\n      <div class=\"panel-sub\">${r.buyer} · outstanding ₹${fmt0(Math.max(0, r.outstanding))}</div></div>\n      <button class=\"icon-btn\" data-close aria-label=\"Close\">${ICON.close}</button>\n    </div>\n    <div class=\"drawer-body\">\n      <div class=\"field\"><label for=\"p-amt\">Amount received (₹)</label>\n        <input class=\"input\" id=\"p-amt\" type=\"number\" min=\"1\" step=\"1\" value=\"${Math.max(0, r.outstanding)}\" data-autofocus></div>\n      <div class=\"field\"><label for=\"p-date\">Receipt date</label>\n        <input class=\"input\" id=\"p-date\" type=\"date\" value=\"${asOf()}\"></div>\n      <div class=\"field\"><label for=\"p-note\">Narration</label>\n        <input class=\"input\" id=\"p-note\" placeholder=\"NEFT ref / cheque no.\"></div>\n    </div>\n    <div class=\"drawer-foot\">\n      <button class=\"btn ghost\" data-close>Cancel</button>\n      <button class=\"btn primary\" id=\"p-save\">${ICON.check} Post receipt</button>\n    </div>\n  `, (modal) => {\n    modal.querySelector('#p-save').onclick = () => {\n      const amount = Number(modal.querySelector('#p-amt').value);\n      const date = modal.querySelector('#p-date').value;\n      const note = modal.querySelector('#p-note').value;\n      try {\n        recordPayment({ lot: r.lot, amount, date, note });\n        closeOverlays();\n        toast(`Receipt of ₹${fmt0(amount)} posted against lot ${r.lot}`, 'good');\n      } catch (e) {\n        toast(e.message, 'bad');\n      }\n    };\n  });\n}\n\n/* -------------------------------------------------------------------------- */\n/* command palette                                                             */\n/* -------------------------------------------------------------------------- */\n\nconst ACTIONS = [\n  ...ROUTES.map((r) => ({ kind: 'Navigate', label: r.label, hint: r.desc, icon: r.icon, run: () => navigate(r.id) })),\n  { kind: 'Action', label: 'Record a payment', hint: 'Post a receipt against a lot', icon: 'payments', run: () => { navigate('payments'); setTimeout(() => document.getElementById('pay-lot')?.focus(), 80); } },\n  { kind: 'Action', label: 'Export filtered lots as CSV', hint: 'Downloads the current selection', icon: 'download', run: () => views.exportFiltered() },\n  { kind: 'Action', label: 'Export audit trail as JSON', hint: 'Machine-readable trail', icon: 'download', run: () => views.exportAudit() },\n  { kind: 'Action', label: 'Toggle light / dark theme', hint: 'Surface appearance', icon: 'sun', run: () => toggleTheme() },\n  { kind: 'Action', label: 'Toggle compact density', hint: 'Tighten spacing', icon: 'menu', run: () => toggleDensity() },\n  { kind: 'Action', label: 'Collapse / expand sidebar', hint: 'Rail mode', icon: 'menu', run: () => toggleRail() },\n  { kind: 'Action', label: 'Re-run data quality audit', hint: 'Recomputes all exceptions', icon: 'refresh', run: () => { _cache = { key: null, value: null }; notify(); toast('Audit recomputed', 'good'); } },\n  { kind: 'Action', label: 'Discard in-session payments', hint: 'Reverts to the source file', icon: 'refresh', run: () => { const n = resetAdjustments(); toast(`${n} adjustment(s) discarded`, 'warn'); } },\n  { kind: 'Action', label: 'Print / save as PDF', hint: 'Uses the print stylesheet', icon: 'download', run: () => window.print() },\n];\n\nexport function openPalette(prefill = '') {\n  store.ui.paletteOpen = true;\n  const el = document.createElement('div');\n  el.className = 'palette';\n  el.setAttribute('role', 'dialog');\n  el.innerHTML = `\n    <div class=\"palette-input\">${ICON.search}<input id=\"pal-q\" placeholder=\"Search lots, buyers, invoices, actions…\" value=\"${prefill}\" aria-label=\"Command palette\"><span class=\"kbd\">esc</span></div>\n    <div class=\"palette-list\" id=\"pal-list\"></div>`;\n  const scrim = document.createElement('div');\n  scrim.className = 'scrim';\n  scrim.style.zIndex = '69';\n  scrim.onclick = closePalette;\n  document.body.append(scrim, el);\n  const input = el.querySelector('#pal-q');\n  const list = el.querySelector('#pal-list');\n  let items = [], active = 0;\n\n  const render = () => {\n    const q = input.value.trim();\n    const actions = ACTIONS\n      .map((a) => ({ ...a, score: q ? fuzzyScore(q, `${a.label} ${a.kind}`) : 10 }))\n      .filter((a) => a.score !== null)\n      .sort((a, b) => b.score - a.score)\n      .slice(0, 8);\n    const lots = q ? searchRecords(derived().records, q).slice(0, 6)\n      .map((r) => ({ kind: 'Lot', label: `Lot ${r.lot} — ${r.buyer}`, hint: `₹${fmtCompact(r.outstanding)} outstanding · ${r.status}`, icon: 'lots',\n        run: () => showLot(r.lot) })) : [];\n    const buyers = q ? derived().buyers.filter((b) => fuzzyScore(q, b.buyer) !== null).slice(0, 5)\n      .map((b) => ({ kind: 'Buyer', label: b.buyer, hint: `${b.count} lots · ₹${fmtCompact(b.receivable)}`, icon: 'buyers',\n        run: () => { store.filter.buyers = [b.buyer]; navigate('lots'); toast(`Filtered to ${b.buyer}`, 'info'); } })) : [];\n    items = [...actions, ...buyers, ...lots];\n    active = 0;\n    list.innerHTML = items.length\n      ? items.map((it, i) => {\n          const first = i === 0 || items[i - 1].kind !== it.kind;\n          return `${first ? `<div class=\"palette-group\">${it.kind}</div>` : ''}\n            <button class=\"palette-item\" data-i=\"${i}\" data-active=\"${i === 0}\">${ICON[it.icon] || ICON.info}<span>${it.label}</span><span class=\"hint\">${it.hint || ''}</span></button>`;\n        }).join('')\n      : `<div class=\"empty\">No matches for “${q}”</div>`;\n    list.querySelectorAll('.palette-item').forEach((b) => {\n      b.onclick = () => { closePalette(); items[Number(b.dataset.i)].run(); };\n      b.onmousemove = () => setActive(Number(b.dataset.i));\n    });\n  };\n  const setActive = (i) => {\n    active = (i + items.length) % Math.max(1, items.length);\n    list.querySelectorAll('.palette-item').forEach((b) => b.dataset.active = String(Number(b.dataset.i) === active));\n    list.querySelector(`[data-i=\"${active}\"]`)?.scrollIntoView({ block: 'nearest' });\n  };\n  input.oninput = render;\n  input.onkeydown = (e) => {\n    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }\n    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }\n    else if (e.key === 'Enter') { e.preventDefault(); closePalette(); items[active]?.run(); }\n    else if (e.key === 'Escape') closePalette();\n  };\n  render();\n  input.focus();\n  input.select();\n}\n\nexport function closePalette() {\n  store.ui.paletteOpen = false;\n  document.querySelectorAll('.palette').forEach((n) => n.remove());\n  document.querySelectorAll('.scrim').forEach((n) => { if (n.style.zIndex === '69') n.remove(); });\n}\n\n/* -------------------------------------------------------------------------- */\n/* preferences                                                                 */\n/* -------------------------------------------------------------------------- */\n\nexport function toggleTheme() {\n  store.ui.theme = store.ui.theme === 'dark' ? 'light' : 'dark';\n  applyPrefs();\n  logAudit('THEME', store.ui.theme);\n}\n\nexport function toggleDensity() {\n  store.ui.density = store.ui.density === 'compact' ? 'comfortable' : 'compact';\n  applyPrefs();\n  logAudit('DENSITY', store.ui.density);\n  notify();\n}\n\nexport function toggleRail() {\n  store.ui.rail = !store.ui.rail;\n  applyPrefs();\n  logAudit('RAIL', String(store.ui.rail));\n  notify();\n}\n\nexport function setAsOf(value) {\n  store.filter.asOf = value || AS_OF;\n  _cache = { key: null, value: null };\n  logAudit('AS_OF', store.filter.asOf);\n  notify();\n}\n\nexport function applyPrefs() {\n  document.documentElement.dataset.theme = store.ui.theme;\n  document.documentElement.dataset.density = store.ui.density;\n  const app = document.querySelector('.app');\n  if (app) app.dataset.rail = String(store.ui.rail);\n}\n\n/* -------------------------------------------------------------------------- */\n/* shell rendering                                                             */\n/* -------------------------------------------------------------------------- */\n\nfunction navBadge(route) {\n  if (route === 'invoices') {\n    const n = derived().issues.filter((i) => i.code.startsWith('MISSING_')).length;\n    return n ? `<span class=\"nav-badge\">${n}</span>` : '';\n  }\n  if (route === 'risk') {\n    const n = derived().risk.filter((r) => r.band.id === 'critical').length;\n    return n ? `<span class=\"nav-badge\">${n}</span>` : '';\n  }\n  if (route === 'payments' && store.adjustments.length) return `<span class=\"nav-badge\">${store.adjustments.length}</span>`;\n  return '';\n}\n\nexport function renderShell() {\n  const app = document.getElementById('app');\n  const groups = [...new Set(ROUTES.map((r) => r.group))];\n  const route = ROUTES.find((r) => r.id === store.ui.route) || ROUTES[0];\n  const d = derived();\n\n  app.innerHTML = `\n    <nav class=\"sidebar\" aria-label=\"Primary\">\n      <div class=\"brand\">\n        <div class=\"brand-mark\">${ICON.logo}</div>\n        <div class=\"brand-text\">\n          <span class=\"brand-name aurora-text\">NEBULA AR</span>\n          <span class=\"brand-sub\">Receivables OS</span>\n        </div>\n      </div>\n      <div class=\"tenant\">\n        <div class=\"tenant-avatar\">MS</div>\n        <div style=\"min-width:0\">\n          <div class=\"tenant-name\">MSTC Limited</div>\n          <div class=\"tenant-plan\">Nebula · Enterprise</div>\n        </div>\n      </div>\n      ${groups.map((g) => `\n        <div class=\"nav-group-title\">${g}</div>\n        ${ROUTES.filter((r) => r.group === g).map((r) => `\n          <button class=\"nav-item\" data-route=\"${r.id}\" ${r.id === route.id ? 'aria-current=\"page\"' : ''} title=\"${r.desc}\">\n            ${ICON[r.icon]}<span class=\"nav-label\">${r.label}</span>${navBadge(r.id)}\n          </button>`).join('')}\n      `).join('')}\n      <div style=\"flex:1\"></div>\n      <div class=\"nav-item\" data-action=\"palette\">${ICON.bolt}<span class=\"nav-label\">Command bar</span><span class=\"kbd hide-sm\">⌘K</span></div>\n    </nav>\n\n    <div class=\"main\">\n      <header class=\"topbar\">\n        <button class=\"icon-btn\" data-action=\"rail\" aria-label=\"Toggle sidebar\">${ICON.menu}</button>\n        <div class=\"crumbs\"><span>${route.group}</span> / <strong>${route.label}</strong></div>\n        <button class=\"searchbox\" data-action=\"palette\">\n          ${ICON.search}<input placeholder=\"Search lots, buyers, invoices…\" aria-label=\"Search\" readonly>\n          <span class=\"kbd\">⌘K</span>\n        </button>\n        <div class=\"topbar-actions\">\n          <span class=\"chip info hide-sm\" title=\"As-of date used by every ageing and penalty calculation\">${ICON.info} as-of ${fmtDate(asOf())}</span>\n          <button class=\"icon-btn\" data-action=\"alerts\" aria-label=\"Exceptions\"><span class=\"dot\"></span>${ICON.bell}</button>\n          <button class=\"icon-btn\" data-action=\"theme\" aria-label=\"Toggle theme\">${store.ui.theme === 'dark' ? ICON.sun : ICON.moon}</button>\n          <button class=\"btn sm\" data-action=\"export\">${ICON.download}<span class=\"hide-sm\">Export</span></button>\n        </div>\n      </header>\n      <main class=\"viewport\" id=\"viewport\"></main>\n    </div>`;\n\n  app.querySelectorAll('[data-route]').forEach((b) => (b.onclick = () => navigate(b.dataset.route)));\n  app.querySelectorAll('[data-action]').forEach((b) => {\n    b.onclick = (e) => {\n      e.preventDefault();\n      const a = b.dataset.action;\n      if (a === 'palette') openPalette();\n      else if (a === 'rail') toggleRail();\n      else if (a === 'theme') toggleTheme();\n      else if (a === 'export') views.exportFiltered();\n      else if (a === 'alerts') showAlerts();\n    };\n  });\n  renderRoute();\n}\n\nexport function renderRoute() {\n  const vp = document.getElementById('viewport');\n  if (!vp) return;\n  const fn = views.PAGES[store.ui.route] || views.dashboard;\n  vp.innerHTML = `<div class=\"page\">${fn()}</div>`;\n  views.mount?.(store.ui.route, vp);\n  document.querySelectorAll('.topbar .crumbs strong').forEach((n) => {\n    n.textContent = (ROUTES.find((r) => r.id === store.ui.route) || ROUTES[0]).label;\n  });\n  document.querySelectorAll('.topbar .crumbs span').forEach((n) => {\n    n.textContent = (ROUTES.find((r) => r.id === store.ui.route) || ROUTES[0]).group;\n  });\n}\n\nfunction showAlerts() {\n  const issues = derived().issues;\n  const groups = {};\n  for (const i of issues) (groups[i.code] ||= []).push(i);\n  openModal(`\n    <div class=\"drawer-head\">\n      <div class=\"grow\"><h2 style=\"font-size:17px\">Exception centre</h2>\n      <div class=\"panel-sub\">${issues.length} finding(s) across ${new Set(issues.map((i) => i.lot)).size} lots</div></div>\n      <button class=\"icon-btn\" data-close aria-label=\"Close\">${ICON.close}</button>\n    </div>\n    <div class=\"drawer-body\">\n      ${Object.entries(groups).map(([code, list]) => `\n        <div class=\"panel\">\n          <div class=\"between mb-2\"><div class=\"panel-title\">${code}</div><span class=\"chip ${list[0].severity === 'high' ? 'bad' : list[0].severity === 'medium' ? 'warn' : 'info'}\">${list.length}</span></div>\n          <div class=\"small muted mb-2\">${list[0].message.replace(/^\\w+ /, '')}</div>\n          <div class=\"row\">${list.map((i) => `<button class=\"btn sm ghost\" data-lot=\"${i.lot}\">Lot ${i.lot}</button>`).join('')}</div>\n        </div>`).join('')}\n    </div>\n    <div class=\"drawer-foot\"><button class=\"btn primary\" data-close>Dismiss</button></div>\n  `, (m) => {\n    m.querySelectorAll('[data-lot]').forEach((b) => (b.onclick = () => { closeOverlays(); showLot(b.dataset.lot); }));\n  });\n}\n\n/* -------------------------------------------------------------------------- */\n/* export helpers                                                              */\n/* -------------------------------------------------------------------------- */\n\nexport function download(filename, text, mime = 'text/csv') {\n  const blob = new Blob([text], { type: `${mime};charset=utf-8` });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = filename;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1500);\n  logAudit('EXPORT', filename);\n}\n\n/* -------------------------------------------------------------------------- */\n/* boot                                                                        */\n/* -------------------------------------------------------------------------- */\n\nfunction login(role) {\n  store.session = { user: role.user, role: role.id, at: new Date().toISOString() };\n  logAudit('SESSION_START', `${role.id} · ${role.user}`);\n  mountApp();\n}\n\nconst ROLES = [\n  { id: 'controller', user: 'Group Controller', label: 'Controller' },\n  { id: 'analyst', user: 'AR Analyst', label: 'Analyst' },\n  { id: 'auditor', user: 'Internal Audit', label: 'Auditor' },\n];\n\nfunction renderLogin() {\n  const host = document.getElementById('app');\n  host.className = 'login';\n  let role = ROLES[0].id;\n  host.innerHTML = `\n    <div class=\"login-card\">\n      <div class=\"login-logo\"><div class=\"brand-mark\">${ICON.logo}</div></div>\n      <h1 class=\"aurora-text\">NEBULA AR</h1>\n      <p class=\"tagline\">Receivables operating system · MSTC Limited</p>\n      <div class=\"role-picker\" id=\"roles\">\n        ${ROLES.map((r) => `<button data-role=\"${r.id}\" aria-pressed=\"${r.id === role}\">${r.label}</butt BULA AR — domain.js\n * Pure, dependency-free domain layer for the receivables SaaS.\n *\n * Everything in this file is deterministic and side-effect free so it can be\n * unit-tested under `node --test` without a browser.\n * ==========================================================================*/\n\nexport const CSV_COLUMNS = [\n  'Lot No.', 'Buyer', 'Material Value', 'Service Charge to MSTC', 'GST TDS',\n  'Total Receivables in Cash', 'Security Deposit Received', 'Security Deposit Date',\n  'Final Payment Received', 'Final Payment Date', 'LPP Expected', 'LPP Received',\n  'LPP Receipt Date', 'Total Received', 'Outstanding', 'Payment Status',\n  'Invoice No.', 'SAP Document', 'Document/Invoice Date',\n];\n\n/** Canonical record shape used everywhere in the app. */\nexport const FIELDS = {\n  lot:            { key: 'lot',            label: 'Lot No.',                 type: 'int',    width: 96 },\n  buyer:          { key: 'buyer',          label: 'Buyer',                   type: 'text',   width: 260 },\n  materialValue:  { key: 'materialValue',  label: 'Material Value',          type: 'money',  width: 130 },\n  serviceCharge:  { key: 'serviceCharge',  label: 'Service Charge to MSTC',  type: 'money',  width: 140 },\n  gstTds:         { key: 'gstTds',         label: 'GST TDS',                 type: 'money',  width: 110 },\n  receivable:     { key: 'receivable',     label: 'Total Receivables in Cash', type: 'money', width: 150 },\n  sdReceived:     { key: 'sdReceived',     label: 'Security Deposit Received', type: 'money', width: 150 },\n  sdDate:         { key: 'sdDate',         label: 'Security Deposit Date',   type: 'date',   width: 140 },\n  fpReceived:     { key: 'fpReceived',     label: 'Final Payment Received',  type: 'money',  width: 140 },\n  fpDate:         { key: 'fpDate',         label: 'Final Payment Date',      type: 'date',   width: 140 },\n  lppExpected:    { key: 'lppExpected',    label: 'LPP Expected',            type: 'money',  width: 120 },\n  lppReceived:    { key: 'lppReceived',    label: 'LPP Received',            type: 'money',  width: 120 },\n  lppDate:        { key: 'lppDate',        label: 'LPP Receipt Date',        type: 'date',   width: 140 },\n  totalReceived:  { key: 'totalReceived',  label: 'Total Received',          type: 'money',  width: 130 },\n  outstanding:    { key: 'outstanding',    label: 'Outstanding',             type: 'money',  width: 130 },\n  status:         { key: 'status',         label: 'Payment Status',          type: 'enum',   width: 130 },\n  invoiceNo:      { key: 'invoiceNo',      label: 'Invoice No.',             type: 'text',   width: 140 },\n  sapDocument:    { key: 'sapDocument',    label: 'SAP Document',            type: 'text',   width: 130 },\n  invoiceDate:    { key: 'invoiceDate',    label: 'Document/Invoice Date',   type: 'date',   width: 150 },\n};\n\nconst HEADER_TO_KEY = {\n  'Lot No.': 'lot', 'Buyer': 'buyer', 'Material Value': 'materialValue',\n  'Service Charge to MSTC': 'serviceCharge', 'GST TDS': 'gstTds',\n  'Total Receivables in Cash': 'receivable',\n  'Security Deposit Received': 'sdReceived', 'Security Deposit Date': 'sdDate',\n  'Final Payment Received': 'fpReceived', 'Final Payment Date': 'fpDate',\n  'LPP Expected': 'lppExpected', 'LPP Received': 'lppReceived',\n  'LPP Receipt Date': 'lppDate', 'Total Received': 'totalReceived',\n  'Outstanding': 'outstanding', 'Payment Status': 'status',\n  'Invoice No.': 'invoiceNo', 'SAP Document': 'sapDocument',\n  'Document/Invoice Date': 'invoiceDate',\n};\n\nconst NUMERIC = new Set(['lot', 'materialValue', 'serviceCharge', 'gstTds', 'receivable',\n  'sdReceived', 'fpReceived', 'lppExpected', 'lppReceived', 'totalReceived', 'outstanding']);\n\n/* -------------------------------------------------------------------------- */\n/* parsing                                                                     */\n/* -------------------------------------------------------------------------- */\n\n/** RFC-4180-ish CSV parser that handles quoted fields and embedded commas. */\nexport function parseCSV(text) {\n  const rows = [];\n  let row = [], field = '', inQuotes = false;\n  for (let i = 0; i < text.length; i++) {\n    const ch = text[i];\n    if (inQuotes) {\n      if (ch === '\"') {\n        if (text[i + 1] === '\"') { field += '\"'; i++; }\n        else inQuotes = false;\n      } else field += ch;\n      continue;\n    }\n    if (ch === '\"') { inQuotes = true; continue; }\n    if (ch === ',') { row.push(field); field = ''; continue; }\n    if (ch === '\\n') { row.push(field); rows.push(row); row = []; field = ''; continue; }\n    if (ch === '\\r') continue;\n    field += ch;\n  }\n  if (field !== '' || row.length) { row.push(field); rows.push(row); }\n  return rows.filter((r) => r.length > 1 || (r.length === 1 && r[0] !== ''));\n}\n\nfunction toNumber(v) {\n  if (v === null || v === undefined) return 0;\n  const s = String(v).trim().replace(/,/g, '');\n  if (s === '') return 0;\n  const n = Number(s);\n  return Number.isFinite(n) ? n : 0;\n}\n\nfunction normaliseDate(v) {\n  const s = String(v ?? '').trim();\n  if (!s || s === '0') return null;\n  let m = s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})$/);\n  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;\n  m = s.match(/^(\\d{1,2})[./-](\\d{1,2})[./-](\\d{4})$/);\n  if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;\n  const d = new Date(s);\n  return Number.isNaN(d.getTime()) ? null : d.toISOString().slice(0, 10);\n}\n\nfunction pad(v) { return String(v).padStart(2, '0'); }\n\n/** Parse the receivables CSV into canonical records. */\nexport function parseReceivables(csvText) {\n  const rows = parseCSV(csvText);\n  if (!rows.length) return [];\n  const header = rows[0].map((h) => h.trim());\n  const keys = header.map((h) => HEADER_TO_KEY[h]);\n  const unknown = header.filter((h, i) => !keys[i]);\n  if (unknown.length) {\n    throw new Error(`Unrecognised CSV column(s): ${unknown.join(', ')}`);\n  }\n  return rows.slice(1).map((cells, idx) => {\n    const rec = { _row: idx + 2 };\n    cells.forEach((raw, i) => {\n      const key = keys[i];\n      if (!key) return;\n      if (NUMERIC.has(key)) rec[key] = toNumber(raw);\n      else if (key.endsWith('Date')) rec[key] = normaliseDate(raw);\n      else rec[key] = String(raw ?? '').trim();\n    });\n    for (const k of NUMERIC) if (rec[k] === undefined) rec[k] = 0;\n    rec.id = `LOT-${rec.lot}`;\n    return rec;\n  });\n}\n\n/* -------------------------------------------------------------------------- */\n/* business rules                                                              */\n/* -------------------------------------------------------------------------- */\n\nexport const SETTLE_THRESHOLD = 5;\nexport const SD_RATE = 0.25;\nexport const FP_RATE = 0.9265;\nexport const LPP_WEEKLY_RATE = 0.0118;\n\nexport function statusFor(outstanding) {\n  return outstanding <= SETTLE_THRESHOLD ? 'SETTLED' : 'OUTSTANDING';\n}\n\n/** ROUND(x, 0), half away from zero — matches Excel and DAX. */\nexport function round0(x) {\n  return x < 0 ? -Math.round(-x) : Math.round(x);\n}\n\nexport function expectedSecurityDeposit(materialValue) {\n  return round0(materialValue * SD_RATE);\n}\n\nexport function expectedFinalPayment(materialValue, gstTds) {\n  return round0(materialValue * FP_RATE - gstTds);\n}\n\n/** Late payment penalty: 1.18% of material value per started week. */\nexport function latePaymentPenalty(materialValue, fpDate, asOf, graceEnd = '2026-08-24', start = '2026-08-22') {\n  if (fpDate && fpDate <= graceEnd) return 0;\n  const end = fpDate ? new Date(fpDate) : new Date(asOf);\n  const weeks = Math.ceil(daysBetween(start, iso(end)) / 7);\n  return materialValue * LPP_WEEKLY_RATE * weeks;\n}\n\nexport function daysBetween(a, b) {\n  return Math.round((new Date(b) - new Date(a)) / 86400000);\n}\n\nexport function iso(d) { return d.toISOString().slice(0, 10); }\n\n/* -------------------------------------------------------------------------- */\n/* row-level validation                                                        */\n/* -------------------------------------------------------------------------- */\n\n/** Recomputes every derived column and reports where the file disagrees. */\nexport function auditRecords(records, asOf) {\n  const issues = [];\n  for (const r of records) {\n    const sum = r.sdReceived + r.fpReceived + r.lppReceived;\n    if (Math.abs(sum - r.totalReceived) > 0.5) {\n      issues.push({ lot: r.lot, severity: 'high', code: 'TOTAL_RECEIVED',\n        message: `Total Received ${fmt0(r.totalReceived)} != SD+FP+LPP ${fmt0(sum)}` });\n    }\n    const out = r.receivable - r.totalReceived;\n    if (Math.abs(out - r.outstanding) > 0.5) {\n      issues.push({ lot: r.lot, severity: 'high', code: 'OUTSTANDING',\n        message: `Outstanding ${fmt0(r.outstanding)} != Receivable-Received ${fmt0(out)}` });\n    }\n    const st = statusFor(r.outstanding);\n    if (r.status !== st) {\n      issues.push({ lot: r.lot, severity: 'high', code: 'STATUS',\n        message: `Status ${r.status} but Outstanding ${fmt0(r.outstanding)} implies ${st}` });\n    }\n    for (const [k, label] of [['invoiceNo', 'Invoice No.'], ['sapDocument', 'SAP Document'], ['invoiceDate', 'Invoice Date']]) {\n      if (!r[k]) issues.push({ lot: r.lot, severity: 'medium', code: `MISSING_${k.toUpperCase()}`, message: `${label} is blank` });\n    }\n    if (r.outstanding < 0) {\n      issues.push({ lot: r.lot, severity: 'low', code: 'OVER_RECEIPT',\n        message: `Over-received by ${fmt0(-r.outstanding)}` });\n    }\n    if (!r.fpDate && r.receivable > 0) {\n      issues.push({ lot: r.lot, severity: 'high', code: 'NO_FP_DATE',\n        message: 'No final-payment receipt date; penalty is still accruing' });\n    }\n    if (r.fpDate && r.fpDate < r.sdDate) {\n      issues.push({ lot: r.lot, severity: 'low', code: 'DATE_ORDER',\n        message: 'Final payment recorded before the security deposit' });\n    }\n    const lpp = latePaymentPenalty(r.materialValue, r.fpDate, asOf);\n    if (Math.abs(lpp - r.lppExpected) > Math.max(2, lpp * 0.02)) {\n      issues.push({ lot: r.lot, severity: 'medium', code: 'LPP_DRIFT',\n        message: `LPP Expected ${fmt0(r.lppExpected)} vs recomputed ${fmt0(lpp)} at ${asOf}` });\n    }\n    if (r.lppReceived > r.lppExpected + 0.5) {\n      issues.push({ lot: r.lot, severity: 'low', code: 'LPP_OVER',\n        message: `LPP Received ${fmt0(r.lppReceived)} exceeds expected ${fmt0(r.lppExpected)}` });\n    }\n  }\n  return issues;\n}\n\n/* -------------------------------------------------------------------------- */\n/* aggregation                                                                 */\n/* -------------------------------------------------------------------------- */\n\nexport function totals(records) {\n  const t = { count: records.length, materialValue: 0, serviceCharge: 0, gstTds: 0,\n    receivable: 0, sdReceived: 0, fpReceived: 0, lppExpected: 0, lppReceived: 0,\n    totalReceived: 0, outstanding: 0, settled: 0, outstandingLots: 0, overReceipt: 0 };\n  for (const r of records) {\n    t.materialValue += r.materialValue;\n    t.serviceCharge += r.serviceCharge;\n    t.gstTds += r.gstTds;\n    t.receivable += r.receivable;\n    t.sdReceived += r.sdReceived;\n    t.fpReceived += r.fpReceived;\n    t.lppExpected += r.lppExpected;\n    t.lppReceived += r.lppReceived;\n    t.totalReceived += r.totalReceived;\n    t.outstanding += r.outstanding;\n    if (r.status === 'SETTLED') t.settled += 1; else t.outstandingLots += 1;\n    if (r.outstanding < 0) t.overReceipt += -r.outstanding;\n  }\n  t.recoveryRate = t.receivable ? t.totalReceived / t.receivable : 0;\n  t.sdExpected = records.reduce((a, r) => a + expectedSecurityDeposit(r.materialValue), 0);\n  t.fpExpected = records.reduce((a, r) => a + expectedFinalPayment(r.materialValue, r.gstTds), 0);\n  t.sdOutstanding = t.sdExpected - t.sdReceived;\n  t.fpOutstanding = t.fpExpected - t.fpReceived;\n  t.avgLotValue = t.count ? t.materialValue / t.count : 0;\n  t.avgDaysToSettle = average(records.filter((r) => r.fpDate && r.sdDate).map((r) => daysBetween(r.sdDate, r.fpDate)));\n  return t;\n}\n\nexport function groupBy(records, keyFn) {\n  const map = new Map();\n  for (const r of records) {\n    const k = keyFn(r);\n    if (!map.has(k)) map.set(k, []);\n    map.get(k).push(r);\n  }\n  return map;\n}\n\nexport function byBuyer(records) {\n  const out = [];\n  for (const [buyer, rows] of groupBy(records, (r) => r.buyer)) {\n    const t = totals(rows);\n    out.push({ buyer, ...t });\n  }\n  return out.sort((a, b) => b.outstanding - a.outstanding || b.receivable - a.receivable);\n}\n\n/** Buckets used by the ageing view. */\nexport const AGE_BUCKETS = [\n  { id: 'current', label: '0-7 days', min: 0, max: 7 },\n  { id: 'b1', label: '8-15 days', min: 8, max: 15 },\n  { id: 'b2', label: '16-30 days', min: 16, max: 30 },\n  { id: 'b3', label: '31-60 days', min: 31, max: 60 },\n  { id: 'b4', label: '60+ days', min: 61, max: Number.MAX_SAFE_INTEGER },\n];\n\nexport function ageInDays(record, asOf) {\n  const anchor = record.fpDate || record.sdDate || record.invoiceDate;\n  if (!anchor) return null;\n  return daysBetween(anchor, asOf);\n}\n\nexport function bucketFor(days) {\n  if (days === null) return null;\n  return AGE_BUCKETS.find((b) => days >= b.min && days <= b.max) || null;\n}\n\nexport function ageingByBuyer(records, asOf) {\n  const rows = byBuyer(records);\n  for (const row of rows) {\n    row.buckets = Object.fromEntries(AGE_BUCKETS.map((b) => [b.id, 0]));\n  }\n  const index = new Map(rows.map((r) => [r.buyer, r]));\n  for (const r of records) {\n    if (r.outstanding <= 0) continue;\n    const b = bucketFor(ageInDays(r, asOf));\n    const target = index.get(r.buyer);\n    if (b && target) target.buckets[b.id] += r.outstanding;\n  }\n  return rows;\n}\n\n/* -------------------------------------------------------------------------- */\n/* time series + forecasting                                                   */\n/* -------------------------------------------------------------------------- */\n\n/** Cumulative received / receivable by calendar day. */\nexport function cumulativeSeries(records, asOf) {\n  const events = [];\n  for (const r of records) {\n    if (r.sdDate && r.sdReceived) events.push({ date: r.sdDate, amount: r.sdReceived, kind: 'Security Deposit' });\n    if (r.fpDate && r.fpReceived) events.push({ date: r.fpDate, amount: r.fpReceived, kind: 'Final Payment' });\n    if (r.lppDate && r.lppReceived) events.push({ date: r.lppDate, amount: r.lppReceived, kind: 'LPP' });\n  }\n  events.sort((a, b) => (a.date < b.date ? -1 : 1));\n  const days = events.length ? uniq(events.map((e) => e.date)) : [asOf];\n  const first = days[0];\n  const span = Math.max(1, daysBetween(first, asOf));\n  const out = [];\n  let running = 0;\n  let cursor = new Date(first);\n  const end = new Date(asOf);\n  let i = 0;\n  while (cursor <= end) {\n    const d = iso(cursor);\n    while (i < events.length && events[i].date <= d) { running += events[i].amount; i++; }\n    out.push({ date: d, received: running });\n    cursor = new Date(cursor.getTime() + 86400000);\n    if (out.length > 4000) break;\n  }\n  void span;\n  return out;\n}\n\nexport function uniq(arr) { return [...new Set(arr)].sort(); }\n\n/** Weekly collections, most recent last. */\nexport function weeklyCollections(records, asOf) {\n  const map = new Map();\n  for (const r of records) {\n    for (const [date, amount, kind] of [\n      [r.sdDate, r.sdReceived, 'Security Deposit'],\n      [r.fpDate, r.fpReceived, 'Final Payment'],\n      [r.lppDate, r.lppReceived, 'LPP'],\n    ]) {\n      if (!date || !amount) continue;\n      const wk = weekStart(date);\n      if (!map.has(wk)) map.set(wk, { week: wk, total: 0, sd: 0, fp: 0, lpp: 0 });\n      const o = map.get(wk);\n      o.total += amount;\n      if (kind === 'Security Deposit') o.sd += amount;\n      else if (kind === 'Final Payment') o.fp += amount;\n      else o.lpp += amount;\n    }\n  }\n  void asOf;\n  return [...map.values()].sort((a, b) => (a.week < b.week ? -1 : 1));\n}\n\nexport function weekStart(dateStr) {\n  const d = new Date(dateStr);\n  const dow = (d.getUTCDay() + 6) % 7; // Monday = 0\n  d.setUTCDate(d.getUTCDate() - dow);\n  return iso(d);\n}\n\n/** Holt's linear (double) exponential smoothing forecast. */\nexport function holtForecast(series, periods = 6, alpha = 0.4, beta = 0.25) {\n  if (series.length < 3) return [];\n  const ys = series.map((p) => p.value);\n  let level = ys[0];\n  let trend = ys[1] - ys[0];\n  for (let i = 1; i < ys.length; i++) {\n    const prevLevel = level;\n    level = alpha * ys[i] + (1 - alpha) * (level + trend);\n    trend = beta * (level - prevLevel) + (1 - beta) * trend;\n  }\n  const out = [];\n  for (let h = 1; h <= periods; h++) out.push({ period: h, value: Math.max(0, level + trend * h) });\n  return out;\n}\n\n/** Naive seasonal projection: reuse the same weekday pattern from history. */\nexport function seasonalForecast(daily, periods = 14) {\n  if (!daily.length) return [];\n  const byDow = new Map();\n  for (const p of daily) {\n    const dow = new Date(p.date).getUTCDay();\n    if (!byDow.has(dow)) byDow.set(dow, []);\n    byDow.get(dow).push(p.value);\n  }\n  const last = new Date(daily[daily.length - 1].date);\n  const out = [];\n  for (let h = 1; h <= periods; h++) {\n    const d = new Date(last.getTime() + h * 86400000);\n    const dow = d.getUTCDay();\n    const hist = byDow.get(dow) || [0];\n    out.push({ date: iso(d), value: average(hist) });\n  }\n  return out;\n}\n\n/* -------------------------------------------------------------------------- */\n/* anomaly detection                                                           */\n/* -------------------------------------------------------------------------- */\n\nexport function average(xs) { return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0; }\n\nexport function stddev(xs) {\n  if (xs.length < 2) return 0;\n  const m = average(xs);\n  return Math.sqrt(average(xs.map((x) => (x - m) ** 2)));\n}\n\n/** Z-score outliers on a numeric field. */\nexport function zScoreOutliers(records, field, threshold = 2) {\n  const xs = records.map((r) => r[field]);\n  const m = average(xs);\n  const sd = stddev(xs);\n  if (!sd) return [];\n  return records\n    .map((r) => ({ record: r, z: (r[field] - m) / sd }))\n    .filter((o) => Math.abs(o.z) >= threshold)\n    .sort((a, b) => Math.abs(b.z) - Math.abs(a.z));\n}\n\n/** Modified z-score using the median absolute deviation — robust to the outliers it finds. */\nexport function madOutliers(records, field, threshold = 3.5) {\n  const xs = records.map((r) => r[field]).slice().sort((a, b) => a - b);\n  const med = median(xs);\n  const devs = xs.map((x) => Math.abs(x - med)).sort((a, b) => a - b);\n  const mad = median(devs);\n  if (!mad) return [];\n  return records\n    .map((r) => ({ record: r, score: (0.6745 * (r[field] - med)) / mad }))\n    .filter((o) => Math.abs(o.score) >= threshold)\n    .sort((a, b) => Math.abs(b.score) - Math.abs(a.score));\n}\n\nexport function median(sorted) {\n  const n = sorted.length;\n  if (!n) return 0;\n  return n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;\n}\n\n/** Composite risk score 0-100 for a lot. */\nexport function riskScore(record, asOf) {\n  let score = 0;\n  const out = Math.max(0, record.outstanding);\n  if (record.receivable) score += Math.min(40, (out / record.receivable) * 60);\n  const age = ageInDays(record, asOf);\n  if (age !== null && out > 0) score += Math.min(30, (age / 60) * 30);\n  if (!record.fpDate) score += 12;\n  if (!record.invoiceNo) score += 6;\n  if (!record.sapDocument) score += 6;\n  if (!record.invoiceDate) score += 6;\n  if (record.materialValue > 1_000_000) score += 5;\n  return Math.round(Math.min(100, score));\n}\n\nexport function riskBand(score) {\n  if (score >= 60) return { id: 'critical', label: 'Critical' };\n  if (score >= 35) return { id: 'high', label: 'High' };\n  if (score >= 15) return { id: 'medium', label: 'Medium' };\n  return { id: 'low', label: 'Low' };\n}\n\n/* -------------------------------------------------------------------------- */\n/* what-if simulation                                                          */\n/* -------------------------------------------------------------------------- */\n\nexport function simulate(records, assumptions) {\n  const {\n    sdCollectionRate = 1, fpCollectionRate = 1, lppWaiver = 0,\n    additionalDays = 0, settleThreshold = SETTLE_THRESHOLD,\n  } = assumptions;\n  const asOf = iso(new Date(Date.now() + additionalDays * 86400000));\n  const rows = records.map((r) => {\n    const lpp = latePaymentPenalty(r.materialValue, r.fpDate, asOf) * (1 - lppWaiver);\n    const receivable = round0(r.materialValue * 1.1765 - r.gstTds + lpp);\n    const sd = r.sdReceived * sdCollectionRate;\n    const fp = r.fpReceived * fpCollectionRate;\n    const received = sd + fp + r.lppReceived;\n    const outstanding = receivable - received;\n    return { ...r, lppExpected: lpp, receivable, sdReceived: sd, fpReceived: fp,\n      totalReceived: received, outstanding,\n      status: outstanding <= settleThreshold ? 'SETTLED' : 'OUTSTANDING' };\n  });\n  const base = totals(records);\n  const next = totals(rows);\n  return { rows, base, next, asOf, delta: {\n    outstanding: next.outstanding - base.outstanding,\n    received: next.totalReceived - base.totalReceived,\n    settled: next.settled - base.settled,\n  } };\n}\n\n/* -------------------------------------------------------------------------- */\n/* formatting + search                                                         */\n/* -------------------------------------------------------------------------- */\n\nexport function fmt0(n) {\n  return Math.round(n).toLocaleString('en-IN');\n}\n\nexport function fmt2(n) {\n  return n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n}\n\nexport function fmtCompact(n) {\n  const abs = Math.abs(n);\n  if (abs >= 1e7) return `${(n / 1e7).toFixed(2)} Cr`;\n  if (abs >= 1e5) return `${(n / 1e5).toFixed(2)} L`;\n  if (abs >= 1e3) return `${(n / 1e3).toFixed(1)}K`;\n  return fmt0(n);\n}\n\nexport function fmtPct(n, digits = 1) { return `${(n * 100).toFixed(digits)}%`; }\n\nexport function fmtDate(d) {\n  if (!d) return '—';\n  const [y, m, day] = d.split('-');\n  return `${day}/${m}/${y}`;\n}\n\n/** Subsequence fuzzy match; returns a score (higher is better) or null. */\nexport function fuzzyScore(needle, haystack) {\n  if (!needle) return 0;\n  const n = needle.toLowerCase();\n  const h = haystack.toLowerCase();\n  const exact = h.indexOf(n);\n  if (exact === 0) return 1000;\n  if (exact > 0) return 500 - exact;\n  let i = 0, score = 0, streak = 0;\n  for (let j = 0; j < h.length && i < n.length; j++) {\n    if (h[j] === n[i]) {\n      i++; streak++;\n      score += 10 + streak * 2;\n    } else streak = 0;\n  }\n  return i === n.length ? score : null;\n}\n\nexport function searchRecords(records, query) {\n  if (!query || !query.trim()) return records;\n  const q = query.trim();\n  const ql = q.toLowerCase();\n  return records\n    .map((r) => {\n      const tokens = [String(r.lot), r.buyer, r.invoiceNo, r.sapDocument, r.status];\n      const hay = tokens.join(' ');\n      let s = fuzzyScore(q, hay);\n      if (s === null) return null;\n      // An identifier that matches a whole field outranks any subsequence match,\n      // otherwise lot 2036 loses to 2033 whose invoice ends in \"...0036\".\n      if (tokens.some((t) => t && String(t).toLowerCase() === ql)) s += 100000;\n      else if (tokens.some((t) => t && String(t).toLowerCase().startsWith(ql))) s += 20000;\n      return { r, s };\n    })\n    .filter(Boolean)\n    .sort((a, b) => b.s - a.s)\n    .map((o) => o.r);\n}\n\n/* -------------------------------------------------------------------------- */\n/* filtering / sorting                                                         */\n/* -------------------------------------------------------------------------- */\n\nexport function filterRecords(records, filter) {\n  const { buyers = [], statuses = [], minOutstanding = null, query = '', missingInvoice = false, riskBand: band = null } = filter;\n  let out = records;\n  if (query) out = searchRecords(out, query);\n  if (buyers.length) out = out.filter((r) => buyers.includes(r.buyer));\n  if (statuses.length) out = out.filter((r) => statuses.includes(r.status));\n  if (minOutstanding !== null) out = out.filter((r) => r.outstanding >= minOutstanding);\n  if (missingInvoice) out = out.filter((r) => !r.invoiceNo || !r.sapDocument || !r.invoiceDate);\n  if (band) out = out.filter((r) => riskBand(riskScore(r, filter.asOf || iso(new Date()))).id === band);\n  return out;\n}\n\nexport function sortRecords(records, key, dir = 'desc') {\n  const mul = dir === 'asc' ? 1 : -1;\n  return records.slice().sort((a, b) => {\n    const x = a[key], y = b[key];\n    if (typeof x === 'number' && typeof y === 'number') return (x - y) * mul;\n    return String(x ?? '').localeCompare(String(y ?? '')) * mul;\n  });\n}\n\nexport function toCSV(records, columns) {\n  const cols = columns || Object.values(FIELDS);\n  const esc = (v) => {\n    const s = v === null || v === undefined ? '' : String(v);\n    return /[\",\\n]/.test(s) ? `\"${s.replace(/\"/g, '\"\"')}\"` : s;\n  };\n  const head = cols.map((c) => esc(c.label)).join(',');\n  const body = records.map((r) => cols.map((c) => esc(r[c.key])).join(',')).join('\\n');\n  return `${head}\\n${body}\\n`;\n}\n"},{"name":"charts.js","code":"/* ============================================================================\n * NEBULA AR — charts.js\n * Dependency-free SVG chart engine. Every chart is a pure function returning an\n * SVG string; the shell injects it and the CSS animates the result.\n * ==========================================================================*/\n\nconst NS = 'http://www.w3.org/2000/svg';\n\nfunction esc(s) {\n  return String(s).replace(/[&<>\"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n}\n\nfunction niceTicks(min, max, count = 5) {\n  if (min === max) { max = min + 1; }\n  const span = max - min;\n  const step0 = span / count;\n  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(step0) || 1)));\n  const norm = step0 / mag;\n  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;\n  const start = Math.floor(min / step) * step;\n  const out = [];\n  for (let v = start; v <= max + step * 0.5; v += step) out.push(Number(v.toFixed(10)));\n  return out;\n}\n\nexport function shortNumber(n) {\n  const abs = Math.abs(n);\n  if (abs >= 1e7) return `${(n / 1e7).toFixed(1)}Cr`;\n  if (abs >= 1e5) return `${(n / 1e5).toFixed(1)}L`;\n  if (abs >= 1e3) return `${(n / 1e3).toFixed(0)}K`;\n  return String(Math.round(n));\n}\n\nconst AX = 'var(--text-dim)';\nconst GRID = 'var(--grid)';\n\n/* -------------------------------------------------------------------------- */\n\n/**\n * Grouped / stacked column chart.\n * series: [{ id, label, color, values: number[] }]\n */\nexport function columnChart({ labels, series, height = 260, stacked = true, valueFormat = shortNumber }) {\n  const w = 900;\n  const padL = 62, padR = 16, padT = 18, padB = 46;\n  const iw = w - padL - padR;\n  const ih = height - padT - padB;\n  const n = labels.length || 1;\n\n  const totalsArr = labels.map((_, i) => series.reduce((a, s) => a + (s.values[i] || 0), 0));\n  const maxV = Math.max(1, ...totalsArr);\n  const ticks = niceTicks(0, maxV, 5);\n  const top = ticks[ticks.length - 1] || maxV;\n  const y = (v) => padT + ih - (v / top) * ih;\n\n  const band = iw / n;\n  const barW = Math.max(4, Math.min(56, band * (stacked ? 0.62 : 0.72 / Math.max(1, series.length))));\n\n  let bars = '';\n  labels.forEach((label, i) => {\n    const cx = padL + band * i + band / 2;\n
